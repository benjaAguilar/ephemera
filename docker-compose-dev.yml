services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - .:/ephemera
      - /ephemera/node_modules
      - /ephemera/apps/server/node_modules
      - /ephemera/apps/client/node_modules
    command: pnpm dev --host
    ports:
      - 3000:3000
      - 5173:5173

volumes:
  postgres_data:
